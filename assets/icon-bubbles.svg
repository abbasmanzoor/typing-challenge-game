<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="body" cx="0.36" cy="0.32" r="0.8">
      <stop offset="0" stop-color="#b9fbff"/>
      <stop offset="0.25" stop-color="#27e6f5"/>
      <stop offset="0.6" stop-color="#6a3cf0"/>
      <stop offset="1" stop-color="#2a0b6e"/>
    </radialGradient>
    <radialGradient id="rim" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.72" stop-color="#a855ff" stop-opacity="0"/>
      <stop offset="0.93" stop-color="#d27bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22e5ff" stop-opacity="0.9"/>
    </radialGradient>
    <radialGradient id="bounce" cx="0.65" cy="0.85" r="0.45">
      <stop offset="0" stop-color="#ff7bf2" stop-opacity="0.65"/>
      <stop offset="1" stop-color="#ff7bf2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.45" stop-color="#22e5ff" stop-opacity="0.5"/>
      <stop offset="0.7" stop-color="#8a3cff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#8a3cff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spec" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="floor" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7a3cff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7a3cff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip"><circle cx="512" cy="500" r="290"/></clipPath>
    <filter id="b20"><feGaussianBlur stdDeviation="20"/></filter>
    <filter id="b6"><feGaussianBlur stdDeviation="6"/></filter>
    <filter id="b2"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="1024" height="1024" fill="#000"/>

  <!-- outer neon aura -->
  <circle cx="512" cy="500" r="470" fill="url(#aura)"/>
  <ellipse cx="512" cy="845" rx="260" ry="40" fill="url(#floor)" filter="url(#b20)"/>

  <!-- sphere -->
  <circle cx="512" cy="500" r="290" fill="url(#body)"/>
  <g clip-path="url(#clip)">
    <circle cx="512" cy="500" r="290" fill="url(#bounce)"/>
    <circle cx="512" cy="500" r="290" fill="url(#rim)"/>
    <!-- inner glow band -->
    <ellipse cx="560" cy="640" rx="230" ry="90" fill="#22e5ff" opacity="0.25" filter="url(#b20)"/>
  </g>

  <!-- neon edge -->
  <circle cx="512" cy="500" r="290" fill="none" stroke="#5ff3ff" stroke-width="3" opacity="0.7" filter="url(#b2)"/>
  <circle cx="512" cy="500" r="292" fill="none" stroke="#b46bff" stroke-width="8" opacity="0.35" filter="url(#b6)"/>

  <!-- highlights -->
  <ellipse cx="420" cy="360" rx="120" ry="70" transform="rotate(-35 420 360)" fill="url(#spec)" opacity="0.9"/>
  <ellipse cx="400" cy="345" rx="52" ry="26" transform="rotate(-35 400 345)" fill="#fff" opacity="0.95" filter="url(#b2)"/>
  <circle cx="610" cy="700" r="10" fill="#fff" opacity="0.5" filter="url(#b2)"/>
</svg>
